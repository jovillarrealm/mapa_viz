[project]
name = "mapa-viz"
version = "0.1.0"
description = "Sistema Automatizado de Generación Cartográfica para Ictiología (geo_map_generator)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cartopy>=0.22.0",
    "folium>=0.15.0",
    "geopandas>=0.14.0",
    "imagecodecs>=2024.1.1",
    "matplotlib>=3.8.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "questionary>=2.1.1",
    "pyyaml>=6.0",
    "rasterio>=1.3.0",
    "requests>=2.31.0",
    "rich>=15.0.0",
    "scipy>=1.11.0",
    "shapely>=2.0.0",
    "adjusttext>=1.4.0",
]

[project.scripts]
geo-map-generator = "main:main"
mapa-viz = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.4.0",
    "ty>=0.0.65",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "ANN401", "TID251"]
ignore = ["B006", "E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Any is banned; define a concrete union, protocol, or structured type." }
"typing_extensions.Any" = { msg = "Any is banned; define a concrete union, protocol, or structured type." }
